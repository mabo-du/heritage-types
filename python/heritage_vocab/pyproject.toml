[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heritage-vocab"
version = "2.0.6"
description = "Offline Getty AAT/ULAN/TGN vocabulary service for archaeological term standardisation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Mark Bouck", email = "markbouck@duck.com" },
]
dependencies = []

[project.urls]
Documentation = "https://github.com/dig-tools/heritage-types#readme"
Issues = "https://github.com/dig-tools/heritage-types/issues"
Repository = "https://github.com/dig-tools/heritage-types.git"

[tool.setuptools]
packages = ["heritage_vocab"]

[tool.setuptools.package-dir]
"heritage_vocab" = "."

[project.optional-dependencies]
dev = ["pytest>=8"]
