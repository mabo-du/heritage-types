name: Publish heritage-models to PyPI

# AGENTS.md `## Versioning Rule` requires coordinated updates across
# HOARD / StratiGraph / Trowel before any breaking (major) bump ships.
# The gate below is mechanical: either the contributor manually approves
# via the Actions UI by typing the acknowledgement text into the
# ``major_bump_acknowledged`` input, OR they have committed a
# ``RELEASE_NOTIFIED_MARK`` sentinel file in the tagged commit. See
# ``RELEASE.md`` for the full procedure.

on:
  workflow_dispatch:
    inputs:
      major_bump_acknowledged:
        description: >-
          Type the sentence "I have notified the downstream maintainers"
          to confirm that AGENTS.md coordination has happened for this
          breaking bump. Required to proceed.
        required: true
      tag_to_publish:
        description: >-
          The models-vX.Y.Z tag to publish. Used to derive the published
          schema filename (e.g. models-v2.0.0 → v2.0.0 → ...v2.0.0.json).
        required: true
  push:
    tags:
      - "models-v*.*.*"

# AGENTS.md `## Versioning Rule` requires coordinated updates across
# HOARD / StratiGraph / Trowel before any breaking (major) bump ships.
# The gates below are mechanical:
#
#   * workflow_dispatch publishes UNCONDITIONALLY once the contributor
#     types "I have notified the downstream maintainers" into the
#     `major_bump_acknowledged` input. This is the *intentional* bypass
#     for breaking-bump publishes — see RELEASE.md step 5.
#
#   * push-to-tag publishes UNCONDITIONALLY for non-major bumps (intra-major
#     patch like models-v2.0.7). For strict major bumps (`models-vN.0.0`)
#     the gate step rejects the tag-pushed run with an actionable error
#     message directing the operator to re-run via workflow_dispatch.
#
# This pattern is forward-compatible: a future `models-v11.0.0` is matched
# by the same regex, not by a brittle v0..v10 enumeration list that would
# silently leak new majors past the gate.

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      ||
      (github.event_name == 'push' && github.ref_type == 'tag')
    steps:
      - uses: actions/checkout@v4

      - name: Validate acknowledgement text for workflow_dispatch trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TEXT="${{ github.event.inputs.major_bump_acknowledged }}"
          if [[ "$TEXT" != *"I have notified the downstream maintainers"* ]]; then
            echo "::error::Component text 'I have notified the downstream maintainers' missing in"
            echo "::error::major_bump_acknowledged input. Refusing to publish a breaking bump"
            echo "::error::without an explicit AGENTS.md-style acknowledgement."
            exit 1
          fi

      - name: Reject tag-pushed strict-major bump
        if: github.event_name == 'push' && github.ref_type == 'tag'
        # Strict-major regex: models-vN.0.0 exactly. Anchored on both
        # sides so intra-major patch bumps (e.g. models-v2.0.7) flow
        # through unhindered — those are non-breaking.
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^models-v[0-9]+\.0\.0$ ]]; then
            echo "::error::Major-bump tag detected: $GITHUB_REF_NAME"
            echo "::error::Per AGENTS.md, breaking changes (model-N.0.0) require explicit"
            echo "::error::coordination with HOARD / StratiGraph / Trowel maintainers."
            echo "::error::Tag-pushing a major bump is not allowed; use workflow_dispatch:"
            echo "::error::"
            echo "::error::    gh workflow run publish-models.yml \\"
            echo "::error::      -f major_bump_acknowledged='I have notified the downstream maintainers' \\"
            echo "::error::      -f tag_to_publish=$GITHUB_REF_NAME"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install TypeSpec dependencies
        run: npm ci

      - name: Compile TypeSpec → JSON Schema
        run: |
          npx tsp compile . \
            --emit @typespec/json-schema \
            --option "@typespec/json-schema.file-type=json" \
            --option "@typespec/json-schema.bundleId=HeritageDataPackage"

      - name: Inline external $refs and hoist scalars to root $defs
        run: |
          set -euo pipefail
          python scripts/_inline_schema.py schemas/HeritageDataPackage
          SCHEMA_VERSION="${GITHUB_REF_NAME#models-v}"
          mv schemas/HeritageDataPackage "schemas/heritage-data-package-v${SCHEMA_VERSION}.json"
        env:
          SCHEMA_VERSION: ${{ github.event.inputs.tag_to_publish || github.ref_name }}

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install codegen dependencies
        # Belt-and-braces pin against wheel-byte drift: SOURCE_DATE_EPOCH
        # + the codegen header strip in _post_process_models handle
        # *content* determinism; pinning the generator version here
        # handles *generator* determinism (the index might otherwise
        # resolve a newer micro-release that emits different bytes for
        # the same input).
        run: uv pip install datamodel-code-generator==0.65.0

      - name: Derive commit epoch for reproducible builds
        id: epoch
        # PEP 517 reproducible-builds convention:
        # https://reproducible-builds.org/specs/source-date-epoch/
        run: |
          set -euo pipefail
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Generate Pydantic models
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: python scripts/generate_python.py

      - name: Smoke-guard generated models for codegen drift
        run: |
          set -euo pipefail
          python -c "
          import pathlib
          text = pathlib.Path('python/heritage_models/models.py').read_text()
          assert 'RootModel[UUID]' not in text, 'codegen drift: _post_process_models missed RootModel[UUID]'
          assert 'RootModel[AwareDatetime]' not in text, 'codegen drift: _post_process_models missed RootModel[AwareDatetime]'
          print('codegen smoke guard OK')
          "

      - name: Build distribution
        run: |
          cd python/heritage_models
          # SOURCE_DATE_EPOCH is the PEP 517 reproducible-builds convention:
          # # https://reproducible-builds.org/specs/source-date-epoch/
          # Pinning it to the git commit epoch ensures the wheel's
          # archive-mtime entries are identical across re-runs of the
          # same commit, so the registry-idempotency gate's local-vs-
          # remote SHA256 comparison can produce a stable skip=true path.
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          # Pin build package so the wheel-archive write path is
          # byte-stable across re-runs. Mirror of the
          # datamodel-code-generator pin in Install codegen dependencies.
          uvx --from build==1.5.0 pyproject-build --outdir dist/

      - name: Check PyPI registry idempotency
        id: check_idemp
        run: |
          set -euo pipefail
          cd python/heritage_models/dist
          shopt -s nullglob
          WHEEL_FILES=(*.whl)
          if (( ${#WHEEL_FILES[@]} < 1 )); then
            echo '::error::No wheel built in python/heritage_models/dist/'
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o pypi_info.json -w "%{http_code}" \
            "https://pypi.org/pypi/heritage-models/json")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "==> heritage-models not yet on PyPI (HTTP ${HTTP_STATUS}); proceeding with publish."
            rm -f pypi_info.json
            exit 0
          fi

          # Iterate every wheel — require ALL to match before emitting
          # skip=true. A multi-wheel release (py3-none-any + abi X) cannot
          # be considered "already published" until every binary matches,
          # otherwise the publish step would re-upload the unmatched one
          # and the workflow would half-success on the next re-run.
          ALL_MATCH=true
          ANY_CONFLICT=false
          for WHEEL_PATH in "${WHEEL_FILES[@]}"; do
            WHEEL_NAME=$(basename "$WHEEL_PATH")
            LOCAL_HASH=$(sha256sum "$WHEEL_PATH" | awk '{print $1}')
            VERSION=$(echo "$WHEEL_NAME" | cut -d'-' -f2)
            REMOTE_HASH=$(jq -r ".releases[\"${VERSION}\"] // [] | .[] | select(.filename == \"${WHEEL_NAME}\") | .digests.sha256 // empty" pypi_info.json)

            if [[ -z "$REMOTE_HASH" ]]; then
              echo "==> heritage-models==${VERSION} (${WHEEL_NAME}) not yet on PyPI; will publish."
              ALL_MATCH=false
            elif [[ "$REMOTE_HASH" != "$LOCAL_HASH" ]]; then
              echo "::error::heritage-models==${VERSION} (${WHEEL_NAME}) exists on PyPI but local sha256 (${LOCAL_HASH}) differs from remote (${REMOTE_HASH})."
              ANY_CONFLICT=true
              ALL_MATCH=false
            else
              echo "    ${WHEEL_NAME}: matching sha256."
            fi
          done
          rm -f pypi_info.json

          if [[ "$ANY_CONFLICT" == "true" ]]; then
            echo "::error::Aborting publish to prevent silent corruption of an existing release."
            exit 1
          elif [[ "$ALL_MATCH" == "true" ]]; then
            echo "==> All ${#WHEEL_FILES[@]} wheel(s) match PyPI exactly; skipping publish (idempotent re-run path)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "==> At least one wheel is missing or conflicted; proceeding with publish."
          fi

      - name: Publish to PyPI
        if: steps.check_idemp.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/heritage_models/dist/
