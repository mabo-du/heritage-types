name: Publish heritage-vocab to PyPI

# Same gating policy as publish-models.yml: strict-major bumps require
# workflow_dispatch with the AGENTS.md acknowledgement text.
#
# Tag pattern: vocab-vX.Y.Z (distinct from models-vX.Y.Z).

on:
  workflow_dispatch:
    inputs:
      major_bump_acknowledged:
        description: >-
          Type the sentence "I have notified the downstream maintainers"
          to confirm that AGENTS.md coordination has happened for this
          breaking bump. Required to proceed.
        required: true
      tag_to_publish:
        description: >-
          The vocab-vX.Y.Z tag to publish. Used to drive the published
          version (e.g. vocab-v2.0.0 → 2.0.0).
        required: true
  push:
    tags:
      - "vocab-v*.*.*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      ||
      (github.event_name == 'push' && github.ref_type == 'tag')
    steps:
      - uses: actions/checkout@v4

      - name: Validate acknowledgement text for workflow_dispatch trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TEXT="${{ github.event.inputs.major_bump_acknowledged }}"
          if [[ "$TEXT" != *"I have notified the downstream maintainers"* ]]; then
            echo "::error::Component text 'I have notified the downstream maintainers' missing in"
            echo "::error::major_bump_acknowledged input. Refusing to publish a breaking bump"
            echo "::error::without an explicit AGENTS.md-style acknowledgement."
            exit 1
          fi

      - name: Reject tag-pushed strict-major bump
        if: github.event_name == 'push' && github.ref_type == 'tag'
        # Strict-major regex: vocab-vN.0.0 exactly.
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^vocab-v[0-9]+\.0\.0$ ]]; then
            echo "::error::Major-bump tag detected: $GITHUB_REF_NAME"
            echo "::error::Per AGENTS.md, breaking changes (vocab-N.0.0) require explicit"
            echo "::error::coordination with HOARD / StratiGraph / Trowel maintainers."
            echo "::error::Tag-pushing a major bump is not allowed; use workflow_dispatch:"
            echo "::error::"
            echo "::error::    gh workflow run publish-vocab.yml \\"
            echo "::error::      -f major_bump_acknowledged='I have notified the downstream maintainers' \\"
            echo "::error::      -f tag_to_publish=$GITHUB_REF_NAME"
            exit 1
          fi

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          uv pip install pytest
          uv pip install -e python/heritage_vocab
          python -m pytest tests/test_heritage_vocab.py -v

      - name: Validate tag_to_publish matches pyproject.toml version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG_VERSION="${{ github.event.inputs.tag_to_publish }}"
          TAG_VERSION="${TAG_VERSION#vocab-v}"
          PYPROJ_VERSION="$(python -c "import tomllib; print(tomllib.load(open('python/heritage_vocab/pyproject.toml','rb'))['project']['version'])")"
          if [[ "$TAG_VERSION" != "$PYPROJ_VERSION" ]]; then
            echo "::error::tag_to_publish version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJ_VERSION)"
            exit 1
          fi

      - name: Derive commit epoch for reproducible builds
        id: epoch
        # PEP 517 reproducible-builds convention:
        # https://reproducible-builds.org/specs/source-date-epoch/
        run: |
          set -euo pipefail
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
          # TZ=UTC so time.localtime(SOURCE_DATE_EPOCH) returns the same
          # date_time tuple across dispatch + local rebuilds; without
          # this, setuptools' ZIP date_time field is host-TZ-shifted
          # (GH-Actions ubuntu-latest vs operator container produce
          # different wheel bytes).
          TZ: UTC
        run: |
          cd python/heritage_vocab
          # SOURCE_DATE_EPOCH pin mirrors publish-models.yml (post-cef633c)
          # so the wheel's archive-mtime entries are identical across
          # re-runs of the same commit, letting the registry-idempotency
          # gate's local-vs-remote sha256 comparison produce a stable
          # skip=true path.
          #
          # umask 022 normalises external_attr (Unix mode bits) across
          # hosts so setuptools stamps consistent mode values; without
          # it, the 15-byte drift observed on heritage-vocab==2.0.3
          # becomes 0.
          umask 022
          # Belt-and-braces pin of build==1.5.0 keeps the wheel-archive
          # writer byte-stable across re-runs.
          uvx --from build==1.5.0 pyproject-build --outdir dist/

      - name: Check PyPI registry idempotency
        id: check_idemp
        # See PUBLISH_RUNBOOK.md § "Gate C — PyPI registry idempotency"
        # for the .releases["${VERSION}"] // [] | .[] rationale and the
        # empirical dry-run recipe. Mirrors publish-models.yml's gate.
        run: |
          set -euo pipefail
          cd python/heritage_vocab/dist
          shopt -s nullglob
          WHEEL_FILES=(*.whl)
          if (( ${#WHEEL_FILES[@]} < 1 )); then
            echo '::error::No wheel built in python/heritage_vocab/dist/'
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o pypi_info.json -w "%{http_code}" \
            "https://pypi.org/pypi/heritage-vocab/json")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "==> heritage-vocab not yet on PyPI (HTTP ${HTTP_STATUS}); proceeding with publish."
            rm -f pypi_info.json
            exit 0
          fi

          # Iterate every wheel — require ALL to match before emitting
          # skip=true. A multi-wheel release cannot be considered 'already
          # published' until every binary matches; otherwise the publish
          # step would re-upload the unmatched one and the workflow
          # would half-success on the next re-run.
          ALL_MATCH=true
          ANY_CONFLICT=false
          for WHEEL_PATH in "${WHEEL_FILES[@]}"; do
            WHEEL_NAME=$(basename "$WHEEL_PATH")
            LOCAL_HASH=$(sha256sum "$WHEEL_PATH" | awk '{print $1}')
            VERSION=$(echo "$WHEEL_NAME" | cut -d'-' -f2)
            REMOTE_HASH=$(jq -r ".releases[\"${VERSION}\"] // [] | .[] | select(.filename == \"${WHEEL_NAME}\") | .digests.sha256 // empty" pypi_info.json)

            if [[ -z "$REMOTE_HASH" ]]; then
              echo "==> heritage-vocab==${VERSION} (${WHEEL_NAME}) not yet on PyPI; will publish."
              ALL_MATCH=false
            elif [[ "$REMOTE_HASH" != "$LOCAL_HASH" ]]; then
              echo "::error::heritage-vocab==${VERSION} (${WHEEL_NAME}) exists on PyPI but local sha256 (${LOCAL_HASH}) differs from remote (${REMOTE_HASH})."
              ANY_CONFLICT=true
              ALL_MATCH=false
            else
              echo "    ${WHEEL_NAME}: matching sha256."
            fi
          done
          rm -f pypi_info.json

          if [[ "$ANY_CONFLICT" == "true" ]]; then
            echo "::error::Aborting publish to prevent silent corruption of an existing release."
            exit 1
          elif [[ "$ALL_MATCH" == "true" ]]; then
            echo "==> All ${#WHEEL_FILES[@]} wheel(s) match PyPI exactly; skipping publish (idempotent re-run path)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "==> At least one wheel is missing or conflicted; proceeding with publish."
          fi

      - name: Publish to PyPI
        if: steps.check_idemp.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/heritage_vocab/dist/
